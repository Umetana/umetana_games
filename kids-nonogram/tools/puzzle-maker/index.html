<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ノノグラム問題メーカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div><p>10×10 EDITOR</p><h1>ノノグラム問題メーカー</h1></div>
    <div class="file-actions">
      <button id="open-file">ファイルを開く</button>
      <button id="save-file" class="primary">名前を付けて保存</button>
      <button id="overwrite-file" hidden>上書き保存</button>
      <button id="download-file">ダウンロード</button>
      <input id="file-input" type="file" accept=".js,text/javascript,application/javascript" hidden>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-labelledby="list-title">
      <div class="section-title"><h2 id="list-title">問題一覧</h2><button id="add-puzzle" class="square" aria-label="問題を追加">＋</button></div>
      <div id="puzzle-list" class="puzzle-list"></div>
      <div class="list-actions">
        <button id="duplicate-puzzle">複製</button>
        <button id="move-up">↑ 上へ</button>
        <button id="move-down">↓ 下へ</button>
        <button id="delete-puzzle" class="danger">削除</button>
      </div>
    </aside>

    <section class="editor" aria-labelledby="editor-title">
      <div class="section-title">
        <div><p id="edit-stage">STAGE 1</p><h2 id="editor-title">問題を編集</h2></div>
        <span id="dirty-mark" class="dirty" hidden>未保存</span>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <div class="metadata">
        <label>ID<input id="field-id" maxlength="40" autocomplete="off"><small>半角英数字・ハイフン・_</small></label>
        <label>問題名<input id="field-name" maxlength="30"></label>
        <label>絵文字<input id="field-placeholder" maxlength="8"></label>
        <label>画像パス<input id="field-image" placeholder="assets/images/cat.webp"></label>
        <label>リビジョン<input id="field-revision" type="number" min="1" step="1" readonly></label>
      </div>

      <div class="workspace">
        <div class="dot-editor">
          <div class="corner" aria-hidden="true"></div>
          <div id="column-clues" class="column-clues"></div>
          <div id="row-clues" class="row-clues"></div>
          <div id="pixel-grid" class="pixel-grid" role="grid" aria-label="10かける10の問題作成盤面"></div>
        </div>
        <aside class="preview">
          <span>完成イメージ</span>
          <div id="mini-preview" class="mini-preview" aria-label="完成イメージ"></div>
          <strong id="filled-count">0 / 100 マス</strong>
        </aside>
      </div>

      <div class="editor-actions">
        <div class="mode-actions" aria-label="描画モード">
          <button class="mode active" data-mode="draw">■ ぬる</button>
          <button class="mode" data-mode="erase">□ けす</button>
        </div>
        <button id="undo" disabled>↶ Undo</button>
        <button id="redo" disabled>↷ Redo</button>
        <button id="clear-grid">全消去</button>
      </div>
      <details class="help">
        <summary>使い方</summary>
        <p>マスをクリックまたはドラッグして絵を作ります。問題を編集して保存すると、その問題のリビジョンが1増えます。出力したファイルをゲームの <code>js/puzzles.js</code> と置き換えてください。</p>
      </details>
    </section>
  </main>

  <div id="dialog-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title">問題を削除しますか？</h2>
      <p>この操作はUndoできません。</p>
      <div><button id="dialog-cancel">やめる</button><button id="dialog-confirm" class="danger">削除する</button></div>
    </section>
  </div>
  <script src="../../js/puzzles.js"></script>
  <script src="maker.js"></script>
</body>
</html>
