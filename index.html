<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e8">
  <meta name="description" content="うめたなのブラウザゲーム置き場です。">
  <title>うめたなゲームズ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263238;
      --muted: #66716f;
      --paper: #fffdf7;
      --accent: #ef6c4d;
      --accent-dark: #c84d32;
      --line: #eadfca;
      --shadow: 0 18px 45px rgba(84, 62, 37, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, #ffe3a8 0 5%, transparent 5.2%),
        radial-gradient(circle at 88% 16%, #ccebdc 0 7%, transparent 7.2%),
        linear-gradient(145deg, #fff9e9, #f5efe3);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0 80px;
    }

    header { margin-bottom: 38px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5.6rem);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .intro {
      max-width: 560px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      display: flex;
      min-height: 300px;
      padding: 28px;
      overflow: hidden;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 24px 55px rgba(84, 62, 37, .18);
      outline: none;
    }

    .card-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .icon {
      display: grid;
      width: 68px;
      height: 68px;
      margin-bottom: 42px;
      place-items: center;
      color: white;
      background: var(--accent);
      border-radius: 20px;
      font-size: 2rem;
      box-shadow: 0 10px 20px rgba(239, 108, 77, .25);
    }

    .card:nth-child(2) .icon {
      background: #3a8f76;
      box-shadow: 0 10px 20px rgba(58, 143, 118, .25);
    }

    h2 { margin: 0 0 9px; font-size: 1.45rem; }

    .card p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.65;
    }

    .play {
      margin-top: auto;
      color: var(--accent-dark);
      font-weight: 800;
    }

    .card:nth-child(2) .play { color: #25735e; }
    .play::after { content: " →"; }

    footer {
      margin-top: 38px;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      main { padding-top: 48px; }
      .card { min-height: 270px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Browser Games</p>
      <h1>うめたな<br>ゲームズ</h1>
      <p class="intro">ちょっとした時間に、すぐ遊べるゲームを置いています。気になるゲームを選んでください。</p>
    </header>

    <section class="games" aria-label="ゲーム一覧">
      <a class="card" href="./kids-nonogram/">
        <div class="card-body">
          <span class="icon" aria-hidden="true">▦</span>
          <h2>ちいさなノノグラム</h2>
          <p>マスをぬって、かくれた絵を見つける10×10パズル。</p>
          <span class="play">あそぶ</span>
        </div>
      </a>

      <a class="card" href="./10x10.html">
        <div class="card-body">
          <span class="icon" aria-hidden="true">✦</span>
          <h2>10×10 ピクセルパズル</h2>
          <p>ヒントをたよりに絵を完成させる、シンプルなノノグラム。</p>
          <span class="play">あそぶ</span>
        </div>
      </a>

      <a class="card" href="./sliding_puzzle_for_kids.html">
        <div class="card-body">
          <span class="icon" aria-hidden="true">✦</span>
          <h2>スライディングパズル</h2>
          <p>ピースを動かして、完成した絵を作り出すパズル。</p>
          <span class="play">あそぶ</span>
        </div>
      </a>
    </section>

    <footer>© Umetana Games</footer>
  </main>
</body>
</html>
