<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>キッズスライディングパズル</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for victory celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            touch-action: manipulation;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Hiragino Kaku Gothic ProN', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Puzzle grid layout styling */
        .puzzle-board {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            position: relative;
            background-color: #f3f4f6;
        }

        /* Movable tile subtle bounce animation for kids hint */
        @keyframes hint-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.96); }
        }

        .movable-hint {
            animation: hint-pulse 1.2s infinite ease-in-out;
            cursor: pointer;
        }

        /* Smooth transition for tiles when moving */
        .puzzle-tile {
            transition: all 0.2s ease-in-out;
        }
        
        .puzzle-tile:hover {
            filter: brightness(1.05);
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header / Title area -->
    <header class="text-center my-2">
        <h1 class="text-3xl md:text-4xl font-bold text-amber-600 flex items-center justify-center gap-2">
            <i class="fa-solid fa-puzzle-piece text-amber-500"></i>
            たのしいえあわせパズル
        </h1>
        <p class="text-amber-700 text-sm md:text-base mt-1">たて・よこに スライドさせて えをかんせいさせよう！</p>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md flex flex-col items-center gap-4">

        <!-- Control Bar: Mode selection & Shuffle button -->
        <div class="w-full bg-white p-3 rounded-2xl shadow-md flex flex-wrap items-center justify-between gap-2 border-2 border-amber-200">
            <!-- Grid size selector -->
            <div class="flex items-center gap-1">
                <span class="text-xs font-bold text-gray-500">サイズ:</span>
                <button id="btn-2x2" onclick="setGridSize(2)" class="px-3 py-1.5 rounded-xl font-bold text-sm bg-amber-500 text-white shadow">2×2 (かんたん)</button>
                <button id="btn-3x3" onclick="setGridSize(3)" class="px-3 py-1.5 rounded-xl font-bold text-sm bg-gray-200 text-gray-700">3×3 (ふつう)</button>
            </div>

            <!-- Hint toggle button -->
            <button id="btn-hint" onclick="toggleHint()" class="px-3 py-1.5 rounded-xl font-bold text-xs bg-emerald-100 text-emerald-700 border border-emerald-300 flex items-center gap-1">
                <i class="fa-solid fa-lightbulb"></i> したえ: ON
            </button>
        </div>

        <!-- Image preset selector / Custom Image Uploader -->
        <div class="w-full bg-white p-2.5 rounded-2xl shadow-md border-2 border-amber-200 flex items-center justify-around gap-2">
            <span class="text-xs font-bold text-gray-500">えらぶ:</span>
            <button onclick="changePreset('animal', event)" class="preset-btn px-3 py-1 rounded-lg border-2 border-amber-400 bg-amber-100 text-lg">🐶 動物</button>
            <button onclick="changePreset('vehicle', event)" class="preset-btn px-3 py-1 rounded-lg border-2 border-transparent bg-gray-100 text-lg">🚀 のりもの</button>
            <button onclick="changePreset('fruit', event)" class="preset-btn px-3 py-1 rounded-lg border-2 border-transparent bg-gray-100 text-lg">🍎 フルーツ</button>
            
            <!-- Upload custom image button -->
            <label class="cursor-pointer bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow">
                <i class="fa-solid fa-image"></i> 写真
                <input type="file" id="image-loader" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </label>
        </div>

        <!-- Puzzle Board Container -->
        <div class="relative w-full aspect-square max-w-[360px] p-2 bg-amber-200 rounded-3xl border-4 border-amber-400">
            <!-- Background hint image (faded complete picture) -->
            <div id="bg-hint" class="absolute inset-2 rounded-2xl overflow-hidden opacity-30 pointer-events-none transition-opacity duration-300">
                <canvas id="hint-canvas" class="w-full h-full"></canvas>
            </div>

            <!-- Interactive puzzle grid -->
            <div id="puzzle-board" class="puzzle-board w-full h-full rounded-2xl overflow-hidden grid gap-1 p-1">
                <!-- Tiles injected dynamically via JavaScript -->
            </div>

            <!-- Game Clear Overlay Screen -->
            <div id="clear-overlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm rounded-3xl flex flex-col items-center justify-center gap-3 text-white opacity-0 pointer-events-none transition-opacity duration-500 z-20">
                <div class="text-5xl animate-bounce">🎉</div>
                <h2 class="text-3xl font-extrabold text-yellow-300 drop-shadow-md">できたー！</h2>
                <p class="text-sm font-bold text-gray-200">すごいね！かんせいしたよ！</p>
                <button onclick="shufflePuzzle()" class="mt-2 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-extrabold text-lg px-6 py-2.5 rounded-full shadow-lg transform active:scale-95 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> もう一回あそぶ
                </button>
            </div>
        </div>

        <!-- Action Button: Start / Shuffle -->
        <button onclick="shufflePuzzle()" class="w-full max-w-[360px] py-3.5 bg-gradient-to-r from-amber-400 to-orange-500 text-white font-bold text-xl rounded-2xl shadow-lg hover:brightness-105 active:scale-98 transition-all flex items-center justify-center gap-2 border-b-4 border-orange-600">
            <i class="fa-solid fa-shuffle"></i> 混ぜてスタート！
        </button>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-amber-700/60 my-2">
        スライディングパズル キッズ Ver.
    </footer>

    <!-- Game Logic Script -->
    <script>
        // Game State Variables
        let gridSize = 2; // Default 2x2 for kids
        let tiles = []; // Array tracking current board state
        let emptyPos = { r: 0, c: 0 }; // Position of the empty tile slot
        let showHint = true;
        let isSolved = false;
        
        // Canvas for generating dynamic picture textures (Placeholders until assets ready)
        let sourceImage = null;
        const mainCanvas = document.createElement('canvas');
        const mainCtx = mainCanvas.getContext('2d');
        mainCanvas.width = 600;
        mainCanvas.height = 600;

        // Init page load
        window.onload = () => {
            loadPresetTheme('animal');
        };

        // Switch difficulty (Grid Size)
        function setGridSize(size) {
            gridSize = size;
            document.getElementById('btn-2x2').className = size === 2 
                ? "px-3 py-1.5 rounded-xl font-bold text-sm bg-amber-500 text-white shadow"
                : "px-3 py-1.5 rounded-xl font-bold text-sm bg-gray-200 text-gray-700";
            document.getElementById('btn-3x3').className = size === 3 
                ? "px-3 py-1.5 rounded-xl font-bold text-sm bg-amber-500 text-white shadow"
                : "px-3 py-1.5 rounded-xl font-bold text-sm bg-gray-200 text-gray-700";
            
            initPuzzle();
        }

        // Toggle background hint image
        function toggleHint() {
            showHint = !showHint;
            const btn = document.getElementById('btn-hint');
            const bgHint = document.getElementById('bg-hint');
            
            if (showHint) {
                btn.innerHTML = `<i class="fa-solid fa-lightbulb"></i> したえ: ON`;
                btn.className = "px-3 py-1.5 rounded-xl font-bold text-xs bg-emerald-100 text-emerald-700 border border-emerald-300 flex items-center gap-1";
                bgHint.style.opacity = "0.3";
            } else {
                btn.innerHTML = `<i class="fa-regular fa-lightbulb"></i> したえ: OFF`;
                btn.className = "px-3 py-1.5 rounded-xl font-bold text-xs bg-gray-100 text-gray-500 border border-gray-300 flex items-center gap-1";
                bgHint.style.opacity = "0";
            }
        }

        // Preset theme switcher function
        function changePreset(type, ev) {
            loadPresetTheme(type, ev);
        }

        // Generate synthetic SVG/Canvas illustration assets (Placeholder)
        function loadPresetTheme(type, ev) {
            // Update active preset UI
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('border-amber-400', 'bg-amber-100');
                btn.classList.add('border-transparent', 'bg-gray-100');
            });
            if (ev && ev.currentTarget) {
                ev.currentTarget.classList.remove('border-transparent', 'bg-gray-100');
                ev.currentTarget.classList.add('border-amber-400', 'bg-amber-100');
            }

            const ctx = mainCtx;
            ctx.clearRect(0, 0, 600, 600);

            if (type === 'animal') {
                // Background
                ctx.fillStyle = "#fde047";
                ctx.fillRect(0, 0, 600, 600);
                // Big Circle Face
                ctx.fillStyle = "#fb923c";
                ctx.beginPath();
                ctx.arc(300, 300, 200, 0, Math.PI * 2);
                ctx.fill();
                // Emoji Icon
                ctx.font = "180px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🐶", 300, 290);
                // Text
                ctx.fillStyle = "#78350f";
                ctx.font = "bold 42px sans-serif";
                ctx.fillText("いぬさん", 300, 470);
            } else if (type === 'vehicle') {
                ctx.fillStyle = "#38bdf8";
                ctx.fillRect(0, 0, 600, 600);
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(300, 300, 210, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = "180px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🚀", 300, 290);
                ctx.fillStyle = "#0369a1";
                ctx.font = "bold 42px sans-serif";
                ctx.fillText("ロケット", 300, 470);
            } else if (type === 'fruit') {
                ctx.fillStyle = "#f43f5e";
                ctx.fillRect(0, 0, 600, 600);
                ctx.fillStyle = "#fff1f2";
                ctx.beginPath();
                ctx.arc(300, 300, 200, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = "180px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🍎", 300, 290);
                ctx.fillStyle = "#9f1239";
                ctx.font = "bold 42px sans-serif";
                ctx.fillText("りんご", 300, 470);
            }

            sourceImage = mainCanvas;
            renderHintBackground();
            initPuzzle();
        }

        // Handle user custom picture upload
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    mainCtx.clearRect(0, 0, 600, 600);
                    // Draw image scaled to center-crop inside 600x600 square
                    const minDim = Math.min(img.width, img.height);
                    const sx = (img.width - minDim) / 2;
                    const sy = (img.height - minDim) / 2;
                    mainCtx.drawImage(img, sx, sy, minDim, minDim, 0, 0, 600, 600);
                    
                    sourceImage = mainCanvas;
                    renderHintBackground();
                    initPuzzle();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Render faded complete picture in background for hint
        function renderHintBackground() {
            const hintCanvas = document.getElementById('hint-canvas');
            hintCanvas.width = 600;
            hintCanvas.height = 600;
            const hCtx = hintCanvas.getContext('2d');
            hCtx.drawImage(sourceImage, 0, 0, 600, 600);
        }

        // Initialize tile grid
        function initPuzzle() {
            isSolved = false;
            document.getElementById('clear-overlay').classList.add('opacity-0', 'pointer-events-none');
            
            tiles = [];
            for (let r = 0; r < gridSize; r++) {
                tiles[r] = [];
                for (let c = 0; c < gridSize; c++) {
                    const originalIndex = r * gridSize + c;
                    tiles[r][c] = {
                        correctR: r,
                        correctC: c,
                        id: originalIndex,
                        isEmpty: (r === gridSize - 1 && c === gridSize - 1) // Bottom-right corner empty
                    };
                    if (tiles[r][c].isEmpty) {
                        emptyPos = { r, c };
                    }
                }
            }
            renderBoard();
        }

        // Render tile elements to HTML DOM
        function renderBoard() {
            const board = document.getElementById('puzzle-board');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${gridSize}, minmax(0, 1fr))`;
            board.style.gridTemplateRows = `repeat(${gridSize}, minmax(0, 1fr))`;

            const movableTiles = getMovablePositions();

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const tile = tiles[r][c];
                    const tileEl = document.createElement('div');
                    tileEl.className = "puzzle-tile relative rounded-xl overflow-hidden shadow-sm flex items-center justify-center font-bold text-white transition-all duration-150 select-none";

                    if (tile.isEmpty && !isSolved) {
                        // Empty slot styling
                        tileEl.className += " bg-amber-100/50 border-2 border-dashed border-amber-300";
                    } else {
                        // Regular piece slicing logic from mainCanvas
                        const pieceCanvas = document.createElement('canvas');
                        pieceCanvas.width = 200;
                        pieceCanvas.height = 200;
                        const pCtx = pieceCanvas.getContext('2d');

                        const srcTileWidth = sourceImage.width / gridSize;
                        const srcTileHeight = sourceImage.height / gridSize;

                        // Slice portion corresponding to correct original tile position
                        pCtx.drawImage(
                            sourceImage,
                            tile.correctC * srcTileWidth,
                            tile.correctR * srcTileHeight,
                            srcTileWidth,
                            srcTileHeight,
                            0, 0, 200, 200
                        );

                        // Subtle tile border & corner indicator numbers for kids
                        pCtx.strokeStyle = "rgba(255, 255, 255, 0.6)";
                        pCtx.lineWidth = 6;
                        pCtx.strokeRect(0, 0, 200, 200);

                        tileEl.style.backgroundImage = `url(${pieceCanvas.toDataURL()})`;
                        tileEl.style.backgroundSize = "cover";

                        // Add number badge overlay (helpful for children)
                        const numberBadge = document.createElement('span');
                        numberBadge.className = "absolute top-1 left-1.5 bg-black/40 text-white text-xs px-1.5 py-0.5 rounded-full font-sans";
                        numberBadge.innerText = tile.id + 1;
                        tileEl.appendChild(numberBadge);

                        // Check if tile is adjacent to empty spot (movable)
                        const isMovable = movableTiles.some(pos => pos.r === r && pos.c === c);
                        if (isMovable && !isSolved) {
                            tileEl.classList.add('movable-hint', 'ring-4', 'ring-amber-300/80');
                            tileEl.onclick = () => moveTile(r, c);
                        }
                    }

                    board.appendChild(tileEl);
                }
            }
        }

        // Get adjacent movable tiles surrounding empty slot
        function getMovablePositions() {
            const { r, c } = emptyPos;
            const positions = [];
            if (r > 0) positions.push({ r: r - 1, c });
            if (r < gridSize - 1) positions.push({ r: r + 1, c });
            if (c > 0) positions.push({ r, c: c - 1 });
            if (c < gridSize - 1) positions.push({ r, c: c + 1 });
            return positions;
        }

        // Handle tile click movement
        function moveTile(r, c) {
            if (isSolved) return;

            // Swap pressed tile with empty slot
            tiles[emptyPos.r][emptyPos.c] = tiles[r][c];
            tiles[r][c] = { isEmpty: true, correctR: gridSize - 1, correctC: gridSize - 1, id: gridSize * gridSize - 1 };
            emptyPos = { r, c };

            renderBoard();
            checkWinCondition();
        }

        // Kid-friendly Shuffle (Reverse random valid moves to ensure solvability)
        function shufflePuzzle() {
            isSolved = false;
            document.getElementById('clear-overlay').classList.add('opacity-0', 'pointer-events-none');
            
            // Reset to solved state first
            initPuzzle();

            // Perform 6 moves for 2x2, 14 moves for 3x3 (Short & easy for kids)
            const shuffleSteps = gridSize === 2 ? 6 : 14;
            let lastPos = null;

            for (let i = 0; i < shuffleSteps; i++) {
                const movable = getMovablePositions().filter(pos => 
                    !lastPos || !(pos.r === lastPos.r && pos.c === lastPos.c)
                );
                // Pick random adjacent tile
                const nextMove = movable[Math.floor(Math.random() * movable.length)];
                
                // Perform swap without render animation during shuffle
                lastPos = { ...emptyPos };
                tiles[emptyPos.r][emptyPos.c] = tiles[nextMove.r][nextMove.c];
                tiles[nextMove.r][nextMove.c] = { isEmpty: true, correctR: gridSize - 1, correctC: gridSize - 1, id: gridSize * gridSize - 1 };
                emptyPos = { r: nextMove.r, c: nextMove.c };
            }

            renderBoard();
        }

        // Check if all tiles are in correct original slots
        function checkWinCondition() {
            let win = true;
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const tile = tiles[r][c];
                    if (!tile.isEmpty && (tile.correctR !== r || tile.correctC !== c)) {
                        win = false;
                        break;
                    }
                }
            }

            if (win) {
                isSolved = true;
                // Reveal full picture by rendering final tile
                renderBoard();

                // Trigger confetti celebration & victory modal
                setTimeout(() => {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                    document.getElementById('clear-overlay').classList.remove('opacity-0', 'pointer-events-none');
                }, 200);
            }
        }
    </script>
</body>
</html>
