    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 10x10 Grid styling */
        .nonogram-grid {
            display: grid;
            grid-template-columns: auto repeat(10, minmax(0, 1fr));
            gap: 1px;
            background-color: #cbd5e1;
            border: 2px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        }

        /* Cell base */
        .grid-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background-color 0.15s ease, transform 0.1s ease;
            cursor: pointer;
            position: relative;
        }

        /* 5x5 Grid line highlights */
        .border-r-thick { border-right: 2px solid #475569 !important; }
        .border-b-thick { border-bottom: 2px solid #475569 !important; }

        /* Cell States */
        .cell-empty { background-color: #ffffff; }
        .cell-empty:hover { background-color: #f1f5f9; }
        
        .cell-filled {
            background-color: #1e293b;
            animation: popIn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cell-cross {
            background-color: #f8fafc;
            color: #ef4444;
            font-size: 1.1rem;
        }
        .cell-cross::after {
            content: '✕';
            color: #ef4444;
            font-weight: 900;
        }

        /* Hint Containers */
        .col-hint-cell {
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 4px 2px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #334155;
            line-height: 1.1;
        }

        .row-hint-cell {
            background-color: #f1f5f9;
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            padding: 2px 6px;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #334155;
            white-space: nowrap;
        }

        .hint-dim {
            opacity: 0.35;
            text-decoration: line-through;
        }

        /* Canvas Pop Effect */
        @keyframes popIn {
            0% { transform: scale(0.7); }
            100% { transform: scale(1); }
        }

        /* Custom Bounce Animation */
        .bounce-active {
            animation: bounceSoft 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Glassmorphism panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Confetti Overlay */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>

        /**
         * Web Audio API Synthesizer for rich sound effects without external audio files
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playPop(freq = 440) {
                if (this.isMuted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playCross() {
                if (this.isMuted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.06);

                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }

            playFanfare() {
                if (this.isMuted) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);

                    gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + idx * 0.1 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.35);
                });
            }
        }

        const audio = new SoundEngine();

        // Game State Variables

        let currentTool = 'fill';  // 'fill' or 'cross'

        let dragModeValue = null;   // Cell value applied during current drag sequence
        let hintsRemaining = 3;

        /**
         * Calculates row hints array from solution matrix
         */
        function calculateRowHints(grid) {
            return grid.map(row => {
                const hints = [];
                let count = 0;
                for (let val of row) {
                    if (val === 1) {
                        count++;
                    } else if (count > 0) {
                        hints.push(count);
                        count = 0;
                    }
                }
                if (count > 0) hints.push(count);
                return hints.length > 0 ? hints : [0];
            });
        }

        /**
         * Calculates column hints array from solution matrix
         */
        function calculateColHints(grid) {
            const cols = grid[0].length;
            const colHints = [];
            for (let c = 0; c < cols; c++) {
                const hints = [];
                let count = 0;
                for (let r = 0; r < grid.length; r++) {
                    if (grid[r][c] === 1) {
                        count++;
                    } else if (count > 0) {
                        hints.push(count);
                        count = 0;
                    }
                }
                if (count > 0) hints.push(count);
                colHints.push(hints.length > 0 ? hints : [0]);
            }
            return colHints;
        }

            const stage = STAGES[currentStageIndex];

            boardEl.innerHTML = '';

            const rowHints = calculateRowHints(stage.grid);
            const colHints = calculateColHints(stage.grid);

            // 1. Top-Left Empty Corner Cell
            const corner = document.createElement('div');
            corner.className = 'bg-slate-200 border-r-thick border-b-thick rounded-tl-md flex items-center justify-center text-xs text-slate-400 font-bold';
            corner.innerText = '10x10';
            boardEl.appendChild(corner);

            // 2. Column Hint Cells
            for (let c = 0; c < 10; c++) {
                const colCell = document.createElement('div');
                let classes = 'col-hint-cell border-b-thick';
                if (c === 4) classes += ' border-r-thick';
                colCell.className = classes;
                colCell.id = `col-hint-${c}`;

                colHints[c].forEach(num => {
                    const span = document.createElement('span');
                    span.innerText = num;
                    colCell.appendChild(span);
                });
                boardEl.appendChild(colCell);
            }

            // 3. Grid Rows (Row Hints + 10 Cells)
            for (let r = 0; r < 10; r++) {
                // Row Hint
                const rowCell = document.createElement('div');
                let rowClasses = 'row-hint-cell border-r-thick';
                if (r === 4) rowClasses += ' border-b-thick';
                rowCell.className = rowClasses;
                rowCell.id = `row-hint-${r}`;

                rowHints[r].forEach(num => {
                    const span = document.createElement('span');
                    span.innerText = num;
                    rowCell.appendChild(span);
                });
                boardEl.appendChild(rowCell);

                // Grid Cells
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    let cellClasses = 'grid-cell';

                    if (c === 4) cellClasses += ' border-r-thick';
                    if (r === 4) cellClasses += ' border-b-thick';

                    cell.className = cellClasses;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.id = `cell-${r}-${c}`;

                    updateCellAppearance(cell, currentGridState[r][c]);

                    // Event Listeners for Interaction
                    cell.addEventListener('mousedown', (e) => handlePointerStart(r, c, e));
                    cell.addEventListener('mouseenter', () => handlePointerEnter(r, c));
                    cell.addEventListener('touchstart', (e) => handleTouchStart(r, c, e), { passive: false });

                    boardEl.appendChild(cell);
                }
            }

            updateStageHeader();
            checkHintsStatus();
        }

        function updateCellAppearance(cellEl, stateValue) {
            cellEl.classList.remove('cell-empty', 'cell-filled', 'cell-cross');
            if (stateValue === 1) {
                cellEl.classList.add('cell-filled');
            } else if (stateValue === 2) {
                cellEl.classList.add('cell-cross');
            } else {
                cellEl.classList.add('cell-empty');
            }
        }

        /**
         * Checks whether rows and columns match solution to strike-through hint numbers
         */
        function checkHintsStatus() {
            const stage = STAGES[currentStageIndex];
            
            // Check rows
            for (let r = 0; r < 10; r++) {
                const isRowComplete = stage.grid[r].every((targetVal, c) => {
                    const userVal = currentGridState[r][c];
                    return (targetVal === 1 && userVal === 1) || (targetVal === 0 && userVal !== 1);
                });
                const hintEl = document.getElementById(`row-hint-${r}`);
                if (hintEl) {
                    if (isRowComplete) hintEl.classList.add('hint-dim');
                    else hintEl.classList.remove('hint-dim');
                }
            }

            // Check cols
            for (let c = 0; c < 10; c++) {
                let isColComplete = true;
                for (let r = 0; r < 10; r++) {
                    const targetVal = stage.grid[r][c];
                    const userVal = currentGridState[r][c];
                    if ((targetVal === 1 && userVal !== 1) || (targetVal === 0 && userVal === 1)) {
                        isColComplete = false;
                        break;
                    }
                }
                const hintEl = document.getElementById(`col-hint-${c}`);
                if (hintEl) {
                    if (isColComplete) hintEl.classList.add('hint-dim');
                    else hintEl.classList.remove('hint-dim');
                }
            }
        }

        function handlePointerStart(r, c, e) {
            if (e) e.preventDefault();
            isPointerDown = true;
            const currentState = currentGridState[r][c];

            if (currentTool === 'fill') {
                dragModeValue = (currentState === 1) ? 0 : 1;
            } else { // 'cross'
                dragModeValue = (currentState === 2) ? 0 : 2;
            }

            applyCellAction(r, c, dragModeValue);
        }

        function handlePointerEnter(r, c) {
            if (isPointerDown && dragModeValue !== null) {
                applyCellAction(r, c, dragModeValue);
            }
        }

        function handleTouchStart(r, c, e) {
            if (e.cancelable) e.preventDefault();
            handlePointerStart(r, c, e);
        }

        // Global touch drag handling using elementFromPoint
        document.addEventListener('touchmove', (e) => {
            if (!isPointerDown) return;
            const touch = e.touches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);

            if (targetEl && targetEl.dataset && targetEl.dataset.row !== undefined) {
                const r = parseInt(targetEl.dataset.row);
                const c = parseInt(targetEl.dataset.col);
                applyCellAction(r, c, dragModeValue);
            }
        }, { passive: false });

        document.addEventListener('mouseup', () => {
            isPointerDown = false;
            dragModeValue = null;
        });
        document.addEventListener('touchend', () => {
            isPointerDown = false;
            dragModeValue = null;
        });

        function applyCellAction(r, c, newValue) {
            if (currentGridState[r][c] === newValue) return;

            currentGridState[r][c] = newValue;
            const cellEl = document.getElementById(`cell-${r}-${c}`);
            if (cellEl) {
                updateCellAppearance(cellEl, newValue);
            }

            // Play audio based on tool action
            if (newValue === 1) audio.playPop(350 + (r + c) * 20);
            else if (newValue === 2) audio.playCross();

            checkHintsStatus();
            checkVictoryCondition();
        }

        function checkVictoryCondition() {
            const stage = STAGES[currentStageIndex];
            
            // Check if all 1s match and no 0 is filled as 1
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    const target = stage.grid[r][c];
                    const user = currentGridState[r][c];
                    if (target === 1 && user !== 1) return false;
                    if (target === 0 && user === 1) return false;
                }
            }

            // STAGE CLEARED!
            clearedStageIds.add(stage.id);
            saveProgress();
            audio.playFanfare();
            triggerConfetti();
            showClearModal();
            updateStageHeader();
            return true;
        }

        function drawPixelArt(canvas, stageGrid, primaryColor, secondaryColor) {
            const ctx = canvas.getContext('2d');
            const cellSize = canvas.width / 10;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    if (stageGrid[r][c] === 1) {
                        ctx.fillStyle = primaryColor;
                    } else {
                        ctx.fillStyle = secondaryColor || '#f8fafc';
                    }
                    ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                }
            }
        }

        function showClearModal() {
            const stage = STAGES[currentStageIndex];
            document.getElementById('clear-art-title').innerText = `「${stage.title}」`;

            const canvas = document.getElementById('clear-art-canvas');
            drawPixelArt(canvas, stage.grid, stage.color, stage.secondaryColor);

            const modal = document.getElementById('modal-clear');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.firstElementChild.classList.remove('scale-95');
            modal.firstElementChild.classList.add('scale-100');
        }

        function hideClearModal() {
            const modal = document.getElementById('modal-clear');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-95');
        }

        function openGalleryModal() {
            renderGallery();
            const modal = document.getElementById('modal-gallery');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.firstElementChild.classList.remove('scale-95');
            modal.firstElementChild.classList.add('scale-100');
        }

        function closeGalleryModal() {
            const modal = document.getElementById('modal-gallery');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-95');
        }

        function renderGallery() {
            const container = document.getElementById('gallery-grid');
            container.innerHTML = '';

            STAGES.forEach((stage, idx) => {
                const isCleared = clearedStageIds.has(stage.id);
                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl border flex flex-col items-center justify-between cursor-pointer transition transform hover:-translate-y-1 ${
                    isCleared ? 'bg-white border-purple-200 shadow-md' : 'bg-slate-50 border-slate-200 opacity-75'
                }`;

                const canvas = document.createElement('canvas');
                canvas.width = 80;
                canvas.height = 80;
                canvas.className = 'rounded-lg border border-slate-200 mb-2';

                if (isCleared) {
                    drawPixelArt(canvas, stage.grid, stage.color, stage.secondaryColor);
                } else {
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillRect(0, 0, 80, 80);
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '24px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', 40, 40);
                }

                card.appendChild(canvas);

                const info = document.createElement('div');
                info.className = 'text-center';
                info.innerHTML = `
                    <div class="text-[10px] font-extrabold text-indigo-500 uppercase">STAGE ${stage.id}</div>
                    <div class="text-xs font-bold text-slate-700">${isCleared ? stage.title : '???'}</div>
                `;
                card.appendChild(info);

                card.addEventListener('click', () => {
                    loadStage(idx);
                    closeGalleryModal();
                });

                container.appendChild(card);
            });
        }

        function giveHint() {
            if (hintsRemaining <= 0) return;
            const stage = STAGES[currentStageIndex];

            // Find first uncompleted filled cell
            const unrevealed = [];
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    if (stage.grid[r][c] === 1 && currentGridState[r][c] !== 1) {
                        unrevealed.push({ r, c });
                    }
                }
            }

            if (unrevealed.length > 0) {
                // Randomly choose 1 hint cell
                const choice = unrevealed[Math.floor(Math.random() * unrevealed.length)];
                currentGridState[choice.r][choice.c] = 1;

                hintsRemaining--;
                document.getElementById('hint-count-text').innerText = hintsRemaining;

                const cellEl = document.getElementById(`cell-${choice.r}-${choice.c}`);
                if (cellEl) {
                    updateCellAppearance(cellEl, 1);
                    cellEl.classList.add('bounce-active');
                    setTimeout(() => cellEl.classList.remove('bounce-active'), 300);
                }

                audio.playPop(600);
                checkHintsStatus();
                checkVictoryCondition();
            }
        }

        function resetStage() {
            currentGridState = Array(10).fill(0).map(() => Array(10).fill(0));
            hintsRemaining = 3;
            document.getElementById('hint-count-text').innerText = hintsRemaining;
            renderBoard();
        }

        function loadStage(idx) {
            currentStageIndex = idx;
            hintsRemaining = 3;
            document.getElementById('hint-count-text').innerText = hintsRemaining;
            currentGridState = Array(10).fill(0).map(() => Array(10).fill(0));
            renderBoard();
        }

        function updateStageHeader() {
            const stage = STAGES[currentStageIndex];
            const isCleared = clearedStageIds.has(stage.id);

            document.getElementById('stage-number-badge').innerText = `STAGE ${String(stage.id).padStart(2, '0')}`;
            document.getElementById('stage-title-text').innerText = isCleared ? stage.title : '???';

            const statusIndicator = document.getElementById('stage-status-indicator');
            const statusText = document.getElementById('status-text');

            if (isCleared) {
                statusIndicator.className = 'flex items-center gap-1.5 text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full';
                statusText.innerText = 'クリア済み';
            } else {
                statusIndicator.className = 'flex items-center gap-1.5 text-xs font-bold text-amber-500 bg-amber-50 px-3 py-1.5 rounded-full';
                statusText.innerText = '挑戦中';
            }
        }

        function saveProgress() {
            const data = {
                clearedStageIds: Array.from(clearedStageIds),
                currentStageIndex: currentStageIndex
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        }

        function loadProgress() {
            const raw = localStorage.getItem(SAVE_KEY);
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    if (data.clearedStageIds) {
                        clearedStageIds = new Set(data.clearedStageIds);
                    }
                    if (data.currentStageIndex !== undefined) {
                        currentStageIndex = data.currentStageIndex;
                    }
                } catch (e) {
                    console.error("Failed to load save data", e);
                }
            }
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10
                });
            }

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.25; // gravity
                    p.rotation += p.rSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                frame++;
                if (frame < 120) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
        }

        window.onload = function() {
            loadProgress();

            // Tool Toggle Buttons
            const fillBtn = document.getElementById('tool-fill');
            const crossBtn = document.getElementById('tool-cross');

            fillBtn.addEventListener('click', () => {
                currentTool = 'fill';
                fillBtn.className = 'py-2.5 rounded-xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 transition shadow-sm bg-indigo-600 text-white';
                crossBtn.className = 'py-2.5 rounded-xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 transition text-slate-600 hover:text-slate-900';
            });

            crossBtn.addEventListener('click', () => {
                currentTool = 'cross';
                crossBtn.className = 'py-2.5 rounded-xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 transition shadow-sm bg-indigo-600 text-white';
                fillBtn.className = 'py-2.5 rounded-xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 transition text-slate-600 hover:text-slate-900';
            });

            // Action Buttons
            document.getElementById('btn-reset').addEventListener('click', resetStage);
            document.getElementById('btn-hint').addEventListener('click', giveHint);

            // Stage Navigation Buttons
            document.getElementById('btn-prev-stage').addEventListener('click', () => {
                const nextIdx = (currentStageIndex - 1 + STAGES.length) % STAGES.length;
                loadStage(nextIdx);
            });
            document.getElementById('btn-next-stage').addEventListener('click', () => {
                const nextIdx = (currentStageIndex + 1) % STAGES.length;
                loadStage(nextIdx);
            });

            // Modals Logic
            document.getElementById('btn-gallery').addEventListener('click', openGalleryModal);
            document.getElementById('btn-close-gallery').addEventListener('click', closeGalleryModal);

            document.getElementById('btn-next-stage-modal').addEventListener('click', () => {
                hideClearModal();
                const nextIdx = (currentStageIndex + 1) % STAGES.length;
                loadStage(nextIdx);
            });

            document.getElementById('btn-gallery-modal').addEventListener('click', () => {
                hideClearModal();
                openGalleryModal();
            });

            // Sound Toggle
            const soundBtn = document.getElementById('btn-sound');
            soundBtn.addEventListener('click', () => {
                audio.isMuted = !audio.isMuted;
                soundBtn.innerHTML = audio.isMuted 
                    ? '<i class="fa-solid fa-volume-xmark text-lg text-red-500"></i>' 
                    : '<i class="fa-solid fa-volume-high text-lg"></i>';
            });

            // Load initial board
            loadStage(currentStageIndex);
        };
    </script>
</body>
