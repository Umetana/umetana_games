<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16385d">
  <title>さんすうクエスト</title>
  <link rel="stylesheet" href="../../engine/player.css">
  <link rel="stylesheet" href="../../events/multiplication-quiz/event.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main id="app" class="app" aria-busy="true">
    <div id="background" class="background" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <header class="topbar">
      <img id="logo" class="logo" src="assets/logos/logo.png" alt="さんすうクエスト">
      <button id="settings-button" class="icon-button" type="button" aria-haspopup="dialog">せってい</button>
    </header>
    <section id="stage" class="stage" aria-label="ものがたり画面">
      <div id="slot-left" class="character-slot left" aria-hidden="true"></div>
      <div id="slot-center" class="character-slot center" aria-hidden="true"></div>
      <div id="slot-right" class="character-slot right" aria-hidden="true"></div>
    </section>
    <section id="message-box" class="message-box hidden" tabindex="0" role="button" aria-label="メッセージ。押すと次へ進みます">
      <div id="speaker" class="speaker"></div>
      <p id="message" class="message"></p>
      <span class="next-mark" aria-hidden="true">▼</span>
    </section>
    <section id="choices" class="choices hidden" aria-label="選択肢"></section>
    <section id="event-layer" class="event-layer hidden" aria-live="polite"></section>
    <section id="end-layer" class="overlay end-layer hidden" aria-live="polite">
      <div class="panel"><p id="end-message" class="end-message"></p><button id="end-restart" type="button">はじめから</button></div>
    </section>
    <section id="error-layer" class="overlay hidden" role="alert">
      <div class="panel"><h1>ゲームを はじめられません</h1><p id="error-message"></p><button id="error-reload" type="button">よみこみなおす</button></div>
    </section>
    <dialog id="settings-dialog">
      <form method="dialog" class="settings-panel">
        <h2>せってい</h2>
        <label><input id="bgm-toggle" type="checkbox" checked> BGMを ならす</label>
        <label><input id="se-toggle" type="checkbox" checked> SEを ならす</label>
        <button id="restart-button" class="danger" type="button">はじめから</button>
        <button value="close" type="submit">とじる</button>
      </form>
    </dialog>
    <div id="notice" class="notice hidden" role="status"></div>
  </main>
  <script src="../../engine/event-registry.js" defer></script>
  <script src="../../engine/validator.js" defer></script>
  <script src="../../events/multiplication-quiz/event.js" defer></script>
  <script src="../../engine/player.js" defer></script>
</body>
</html>
